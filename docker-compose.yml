version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kh-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kh-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kh-app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:${PORT}/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - kh-network

  adminer:
    image: adminer
    container_name: kh-adminer
    restart: always
    profiles:
      - debug
    ports:
      - '8080:8080'
    networks:
      - kh-network

networks:
  kh-network:
    driver: bridge

volumes:
  postgres_data:
